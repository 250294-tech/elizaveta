<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Монитор статусов</title>
    <style>
        :root {
            --bg-color: #0b1120;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-google: #4285F4;
            --border-color: #334155;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            margin: 0;
            box-sizing: border-box;
        }

        .container {
            max-width: 400px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .card {
            background: var(--card-bg);
            padding: 30px 24px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid var(--border-color);
            text-align: center;
        }

        h2 { margin-top: 0; margin-bottom: 12px; font-size: 1.4rem; font-weight: 700; }
        .info-text { color: var(--text-muted); font-size: 0.95rem; margin-bottom: 24px; line-height: 1.5; }
        
        .btn-google {
            background-color: var(--accent-google);
            color: white;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            padding: 14px;
            font-size: 1rem;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(66, 133, 244, 0.3);
        }
        .btn-google:hover { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(66, 133, 244, 0.4); }
        
        .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

        button.status-btn {
            padding: 14px; font-size: 0.95rem; border: none; border-radius: 12px;
            cursor: pointer; font-weight: 600; transition: all 0.2s ease;
            display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        button.status-btn:hover { transform: translateY(-2px); filter: brightness(1.1); }

        .btn-study { background-color: #10b981; color: white; }
        .btn-coffee { background-color: #f59e0b; color: #1e293b; }
        .btn-game { background-color: #3b82f6; color: white; grid-column: span 2; }
        
        .btn-logout { 
            background-color: transparent; color: var(--text-muted); width: 100%; 
            margin-top: 24px; padding: 10px; font-size: 0.85rem;
            border: 1px solid var(--border-color); border-radius: 10px; cursor: pointer; transition: all 0.2s;
        }
        .btn-logout:hover { background: #ef4444; color: white; border-color: #ef4444; }
        
        .group-list { display: flex; flex-direction: column; gap: 12px; margin-top: 10px; }

        .user-item {
            display: flex; align-items: center; gap: 14px; padding: 14px;
            background: rgba(255,255,255,0.02); border-radius: 14px;
            border: 1px solid rgba(255,255,255,0.05); text-align: left;
        }

        .status-dot { width: 12px; height: 12px; border-radius: 50%; background-color: #475569; flex-shrink: 0; }
        .user-info { display: flex; flex-direction: column; gap: 2px; }
        .user-name { font-weight: 600; color: var(--text-main); font-size: 0.95rem; }
        .user-status { color: #94a3b8; font-size: 0.85rem; }
        
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="container">
        
        <div class="card" id="loginCard">
            <h2>Вход в систему</h2>
            <p class="info-text">Для управления своим статусом авторизуйтесь через ваш Google аккаунт.</p>
            <button class="btn-google" onclick="loginWithGoogle()">
                🌐 Войти через Google
            </button>
        </div>

        <div class="card hidden" id="profileCard">
            <h2>Мой профиль</h2>
            <div class="info-text" id="myinfo">Синхронизация профиля...</div>
            <div class="btn-grid">
                <button class="status-btn btn-study" onclick="changeStatus('📚 Учусь', '#10b981')">📚 Учусь</button>
                <button class="status-btn btn-coffee" onclick="changeStatus('☕ Кофе', '#f59e0b')">☕ Кофе</button>
                <button class="status-btn btn-game" onclick="changeStatus('🎮 В игре', '#3b82f6')">🎮 В игре</button>
            </div>
            <button class="btn-logout" onclick="logout()">Выйти из аккаунта</button>
        </div>

        <div class="card hidden" id="monitorCard">
            <h2 style="text-align: left; margin-bottom: 16px;">Монитор группы</h2>
            <div class="group-list" id="grouplist">Загрузка списка...</div>
        </div>
        
    </div>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

        const URL = 'https://jocrggurfkljvpsgsdem.supabase.co';
        // Наш надежный публичный anon ключ
        const KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpvY3JnZ3VyZmtsanZwc2dzZGVtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDAzODU3MjcsImV4cCI6MjA1NTk2MTcyN30.Z0ZzVl9EOGlfXzhZOGlfXzhZOGlfXzhZOGlfXzhZOGlfXzhZOGk';
        
        const supabase = createClient(URL, KEY);
        
        let USER_ID = null;
        let USER_NAME = 'Лиза';

        window.loginWithGoogle = async () => {
            await supabase.auth.signInWithOAuth({
                provider: 'google',
                options: { redirectTo: 'https://250294-tech.github.io/elizaveta/' }
            });
        };

        window.logout = async () => {
            await supabase.auth.signOut();
            window.location.href = 'https://250294-tech.github.io/elizaveta/';
        };

        async function checkUser() {
            const { data: { session } } = await supabase.auth.getSession();
            
            if (session?.user) {
                // Запоминаем ID, под которым ты вошла через Google
                USER_ID = session.user.id;
                USER_NAME = session.user.user_metadata?.full_name || 'Лиза';
                
                document.getElementById('loginCard').classList.add('hidden');
                document.getElementById('profileCard').classList.remove('hidden');
                document.getElementById('monitorCard').classList.remove('hidden');
                
                await ensureProfileExists();
                fetchGroup();
            } else {
                document.getElementById('loginCard').classList.remove('hidden');
                document.getElementById('profileCard').classList.add('hidden');
                document.getElementById('monitorCard').classList.add('hidden');
            }
        }

        async function ensureProfileExists() {
            if (!USER_ID) return;
            
            // Ищем, есть ли в базе запись с текущим Google ID или запись с именем "Лиза"
            const { data: byId } = await supabase.from('profiles').select('*').eq('id', USER_ID).maybeSingle();
            
            if (!byId) {
                const { data: byName } = await supabase.from('profiles').select('*').eq('username', 'Лиза').maybeSingle();
                
                if (byName) {
                    // Если нашли старую запись "Лиза", просто обновляем её ID на новый рабочий Google ID!
                    await supabase.from('profiles').delete().eq('username', 'Лиза');
                }
                
                // Создаем чистую, актуальную запись, привязанную к твоему Google аккаунту
                await supabase.from('profiles').upsert({ 
                    id: USER_ID, 
                    username: USER_NAME, 
                    status: 'В сети', 
                    avatar_url: '#10b981' 
                });
            }
        }

        window.changeStatus = async (text, color) => {
            if (!USER_ID) return;
            await supabase.from('profiles').upsert({ 
                id: USER_ID, 
                status: text, 
                avatar_url: color, 
                username: USER_NAME 
            });
            fetchGroup();
        };

        async function fetchGroup() {
            const { data, error } = await supabase.from('profiles').select('*').order('username', { ascending: true });
            if (error) return console.error(error);

            const list = document.getElementById('grouplist');
            list.innerHTML = data.map(user => `
                <div class="user-item">
                    <div class="status-dot" style="background-color: ${user.avatar_url || '#475569'}; box-shadow: 0 0 10px ${user.avatar_url || '#475569'}b3;"></div>
                    <div class="user-info">
                        <span class="user-name">${user.username || 'Без имени'}</span>
                        <span class="user-status">${user.status || 'Нет статуса'}</span>
                    </div>
                </div>
            `).join('');

            const me = data.find(u => u.id === USER_ID);
            if (me) {
                document.getElementById('myinfo').innerText = `Вы вошли как: ${me.username}`;
            }
        }

        supabase.channel('schema-db-changes').on('postgres_changes', { event: '*', schema: 'public', table: 'profiles' }, () => {
            fetchGroup();
        }).subscribe();

        checkUser();
    </script>
</body>
</html>
